name: Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Read the repo, create a Pages deployment, and mint the OIDC token
# deploy-pages uses to prove the deployment came from this workflow run.
# No write access to repo contents is needed: nothing is pushed to a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Fails early with a clear message if the repository's Pages source is
    # not set to "GitHub Actions".
    - uses: actions/configure-pages@v6

    # Installs the tools pinned in mise.toml — the same versions used
    # locally — and puts them on PATH for the steps below.
    - uses: jdx/mise-action@v4

    - name: Build
      run: zola build

    - uses: actions/upload-pages-artifact@v5
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
