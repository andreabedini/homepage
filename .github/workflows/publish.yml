name: Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: jdx/mise-action@v4

    - name: Build
      run: zola build

    - name: Publish
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public
        cname: www.andreabedini.com
