{% set path = current_path or "" %}
<header class="site-nav">
  <a href="/">{{<wordmark size="md" />}}</a>
  <nav class="site-nav__links">
    {% for item in config.extra.nav %}
      {% if item.url == "/" %}
        {% set is_current = path == "/" %}
      {% else %}
        {% set is_current = path is starting_with(pat=item.url) %}
      {% endif %}
      <a href="{{ item.url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" onclick="abTheme(this)">
    <span class="theme-toggle__moon">{{<icon name="moon" />}}</span>
    <span class="theme-toggle__sun">{{<icon name="sun" />}}</span>
  </button>
</header>
