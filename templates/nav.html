{% set path = current_path or "" %}
<header class="site-nav">
  <a href="/" style="text-decoration:none">{{<wordmark size="md" />}}</a>
  <nav class="site-nav__links">
    {% for item in config.extra.nav %}
      {% if item.url == "/" %}
        {% set is_current = path == "/" %}
      {% else %}
        {% set is_current = path is starting_with(pat=item.url) %}
      {% endif %}
      <a href="{{ item.url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
