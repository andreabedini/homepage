<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){
    var el = document.documentElement;
    try { var t = localStorage.getItem('ab-theme'); if (t) el.setAttribute('data-theme', t); } catch (e) {}
    function isDark() {
      var cur = el.getAttribute('data-theme');
      return cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    window.abTheme = function (btn) {
      if (btn) {
        var next = isDark() ? 'light' : 'dark';
        el.setAttribute('data-theme', next);
        try { localStorage.setItem('ab-theme', next); } catch (e) {}
      }
      var b = btn || document.querySelector('.theme-toggle');
      if (b) b.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
    };
    document.addEventListener('DOMContentLoaded', function () { window.abTheme(null); });
  })();</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500;1,6..72,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">

  <link rel="stylesheet" href="{{ get_url(path='css/ds/styles.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='css/site.css') }}">

  <link rel="icon" href="{{ get_url(path='images/avatar-coral.png') }}">
    <link rel="alternate" type="application/atom+xml" title="{{ config.title }}"
        href="{{ get_url(path='posts/atom.xml') }}">
</head>
<body>
  <div class="shell shell--main">
    {% include "nav.html" %}
    <main class="site-main">
      {% block content %}{% endblock content %}
    </main>
  </div>
  <div class="shell shell--wide">
    {% include "footer.html" %}
  </div>
</body>
</html>
