<footer class="site-footer" data-theme="ink">
  <div class="site-footer__top">
    <div>
      {{<wordmark size="lg" />}}
      <p class="site-footer__blurb">Curious by default. Based in Perth, Australia.</p>
    </div>
    <div class="site-footer__links">
      {% for link in config.extra.social %}
      <a class="social-link" href="{{ link.href }}">{{<icon name={link.icon} />}}{{ link.label }}</a>
      {% endfor %}
    </div>
  </div>
  <div class="site-footer__colophon">// built with curiosity &middot; {{ now() | date(format="%Y") }}</div>
</footer>
